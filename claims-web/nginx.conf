# Same routing as proxy.conf.mjs in development: one origin for the browser, each API prefix to its service.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;   # claims-service accepts 5 MB documents (6 MB per request)

    # The app has its own sign-in page; drop the Basic challenge so browsers do not show their login dialog on 401.
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/reports       { proxy_pass http://reporting-service:8082; }
    location /api/notifications { proxy_pass http://notification-service:8083; }
    location /api/              { proxy_pass http://claims-service:8081; }

    # Security headers are repeated per location: an add_header in a location replaces the inherited ones.
    # Hashed bundles can be cached forever; index.html never, so a deploy is picked up immediately.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
