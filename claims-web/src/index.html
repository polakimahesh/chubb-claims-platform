<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claims Platform</title>
    <meta name="description" content="Report, track and manage motor and property claims." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <!-- Apply the saved theme before the app starts, so a dark-mode user never sees a white flash. -->
    <script>
      try {
        var t = localStorage.getItem('claims.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>The Claims Platform needs JavaScript to run.</noscript>
  </body>
</html>
