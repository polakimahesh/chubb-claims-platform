openapi: 3.0.1
info:
  title: Claims Service API
  description: "System of record for motor and property claims: claimant submission\
    \ and tracking, documents, staff queue and decisions. Authentication is HTTP Basic;\
    \ roles are CLAIMANT (the e-mail is the username), OFFICER and MANAGER. Errors\
    \ use RFC 7807 problem details: 400 validation, 401 not authenticated, 403 not\
    \ permitted, 404 unknown claim, 409 invalid transition or concurrent update, 415\
    \ unsupported document type, 422 business-rule violation."
  version: 0.2.0
servers:
- url: http://localhost:8081
  description: Local
security:
- basicAuth: []
paths:
  /api/staff/claims/{id}/settle:
    post:
      tags:
      - Claims staff
      summary: Settle an approved claim (APPROVED -> SETTLED)
      operationId: settle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/staff/claims/{id}/reject:
    post:
      tags:
      - Claims staff
      summary: Reject a claim (UNDER_REVIEW -> REJECTED)
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reject"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/staff/claims/{id}/reassign:
    post:
      tags:
      - Claims staff
      summary: "Hand a claim in review to another officer (its officer, or any claim\
        \ for a manager)"
      operationId: reassign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reassign"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/staff/claims/{id}/info-requests:
    post:
      tags:
      - Claims staff
      summary: Ask the claimant for more information (UNDER_REVIEW -> INFO_REQUESTED)
      operationId: requestInfo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfoQuestion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Info"
  /api/staff/claims/{id}/assign:
    post:
      tags:
      - Claims staff
      summary: Pick up a claim from the queue (SUBMITTED -> UNDER_REVIEW)
      operationId: assign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/staff/claims/{id}/assess:
    post:
      tags:
      - Claims staff
      summary: Record the liability assessment (claim stays UNDER_REVIEW)
      operationId: assess
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assess"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/staff/claims/{id}/approve:
    post:
      tags:
      - Claims staff
      summary: Approve an assessed claim (UNDER_REVIEW -> APPROVED)
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/claims:
    get:
      tags:
      - Claimant
      summary: List my claims (role CLAIMANT)
      operationId: listMine
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSummary"
    post:
      tags:
      - Claimant
      summary: Report an incident / submit a claim (role CLAIMANT; the authenticated
        user is the claimant)
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Submit"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/claims/{id}/info-requests/{requestId}/response:
    post:
      tags:
      - Claimant
      summary: Provide additional information when asked (role CLAIMANT)
      operationId: respond
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfoAnswer"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Info"
  /api/claims/{claimId}/documents:
    get:
      tags:
      - Documents
      summary: List a claim's documents
      operationId: list
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"
    post:
      tags:
      - Documents
      summary: Attach a PDF/PNG/JPEG (max 5 MB) to my claim; multipart part name 'file'
      operationId: upload
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DocumentInfo"
  /api/staff/claims:
    get:
      tags:
      - Claims staff
      summary: "Workload: my claims (officers), or any officer's via officerId (managers)"
      operationId: workload
      parameters:
      - name: officerId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSummary"
  /api/staff/claims/queue:
    get:
      tags:
      - Claims staff
      summary: "Intake queue: unassigned claims, oldest first, filterable by market\
        \ and type"
      operationId: queue
      parameters:
      - name: market
        in: query
        required: false
        schema:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
      - name: claimType
        in: query
        required: false
        schema:
          type: string
          enum:
          - MOTOR
          - PROPERTY
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSummary"
  /api/claims/{id}:
    get:
      tags:
      - Claimant
      summary: Track a claim (claimants see only their own)
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
  /api/claims/{id}/info-requests:
    get:
      tags:
      - Claimant
      summary: Information requested from the claimant (open and answered)
      operationId: infoRequests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Info"
  /api/claims/{id}/history:
    get:
      tags:
      - Claimant
      summary: Status timeline of a claim
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
  /api/claims/{claimId}/documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Download a document
      operationId: download
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
components:
  schemas:
    Detail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claimNumber:
          type: string
        market:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
        claimType:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
        claimantName:
          type: string
        claimantEmail:
          type: string
        description:
          type: string
        incidentDate:
          type: string
          format: date
        currency:
          type: string
        estimatedAmount:
          type: number
        assessedAmount:
          type: number
        assignedOfficerId:
          type: string
        rejectionReason:
          type: string
        submittedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    Reject:
      required:
      - reason
      type: object
      properties:
        reason:
          maxLength: 1000
          minLength: 0
          type: string
    Reassign:
      required:
      - toOfficerId
      type: object
      properties:
        toOfficerId:
          maxLength: 100
          minLength: 0
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
    InfoQuestion:
      required:
      - question
      type: object
      properties:
        question:
          maxLength: 2000
          minLength: 0
          type: string
    Info:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        response:
          type: string
        respondedAt:
          type: string
          format: date-time
        open:
          type: boolean
    Assess:
      required:
      - assessedAmount
      type: object
      properties:
        assessedAmount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        note:
          maxLength: 2000
          minLength: 0
          type: string
    Submit:
      required:
      - claimType
      - claimantName
      - currency
      - description
      - estimatedAmount
      - incidentDate
      - market
      type: object
      properties:
        claimantName:
          maxLength: 200
          minLength: 0
          type: string
        market:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
        claimType:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        description:
          maxLength: 4000
          minLength: 0
          type: string
        incidentDate:
          type: string
          format: date
        currency:
          pattern: "[A-Z]{3}"
          type: string
        estimatedAmount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
    InfoAnswer:
      required:
      - response
      type: object
      properties:
        response:
          maxLength: 4000
          minLength: 0
          type: string
    DocumentInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
        uploadedAt:
          type: string
          format: date-time
    PageResponseSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Summary"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claimNumber:
          type: string
        market:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
        claimType:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
        currency:
          type: string
        estimatedAmount:
          type: number
        assessedAmount:
          type: number
        assignedOfficerId:
          type: string
        submittedAt:
          type: string
          format: date-time
    HistoryEntry:
      type: object
      properties:
        fromStatus:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
        toStatus:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
        actor:
          type: string
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
