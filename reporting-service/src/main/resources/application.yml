server:
  port: 8082

spring:
  application:
    name: reporting-service
  datasource:
    # Defaults to in-memory H2 so the service runs with no setup; docker-compose overrides these with PostgreSQL.
    url: ${DB_URL:jdbc:h2:mem:reporting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: reporting-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:   # used only to dead-letter poison messages
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

reporting:
  sla:
    unassigned-hours: 24   # SUBMITTED and not picked up within this long is a breach
    open-days: 7           # UNDER_REVIEW / APPROVED for longer than this is a breach
  fx:
    # Indicative static rates: value of 1 unit of the currency in USD. NOT live market data; replace the
    # FxRateProvider implementation to use a treasury/market-data source.
    rates-to-usd:
      USD: 1.0
      SGD: 0.74
      HKD: 0.128
      MYR: 0.21
      THB: 0.029
      IDR: 0.000061
      AUD: 0.65
