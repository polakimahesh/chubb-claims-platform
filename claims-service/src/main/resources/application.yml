server:
  port: 8081

spring:
  application:
    name: claims-service
  datasource:
    # Defaults to in-memory H2 so the service runs with no setup; docker-compose overrides these with PostgreSQL.
    url: ${DB_URL:jdbc:h2:mem:claims;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

claims:
  outbox:
    enabled: true
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
