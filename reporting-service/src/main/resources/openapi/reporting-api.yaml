openapi: 3.0.1
info:
  title: Reporting Service API
  description: "Manager-facing read API (role MANAGER, HTTP Basic) built from claims-service\
    \ events on Kafka. Data is eventually consistent (typically about a second behind).\
    \ Exposure is reported per currency; the /exposure/total endpoint converts using\
    \ static indicative rates only."
  version: 0.2.0
servers:
- url: http://localhost:8082
  description: Local
security:
- basicAuth: []
paths:
  /api/reports/workload:
    get:
      tags:
      - Reports
      summary: "Open claims per officer, by status"
      operationId: workload
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficerWorkload"
  /api/reports/summary:
    get:
      tags:
      - Reports
      summary: "Claims by status, backlog and outstanding exposure"
      operationId: summary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Summary"
  /api/reports/sla-breaches:
    get:
      tags:
      - Reports
      summary: "Claims breaching service levels: unassigned too long, or open too\
        \ long (oldest first)"
      operationId: slaBreaches
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaBreach"
  /api/reports/performance:
    get:
      tags:
      - Reports
      summary: Closed claims and average resolution time per officer
      operationId: performance
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficerPerformance"
  /api/reports/exposure:
    get:
      tags:
      - Reports
      summary: "Outstanding liability exposure of open claims by market, type and\
        \ currency"
      operationId: exposure
      parameters:
      - name: market
        in: query
        required: false
        schema:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exposure"
  /api/reports/exposure/total:
    get:
      tags:
      - Reports
      summary: Total outstanding exposure converted into one base currency (indicative
        static rates)
      operationId: exposureTotal
      parameters:
      - name: baseCurrency
        in: query
        required: false
        schema:
          type: string
          default: USD
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExposureTotal"
components:
  schemas:
    OfficerWorkload:
      type: object
      properties:
        officerId:
          type: string
        openClaims:
          type: integer
          format: int64
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
    Exposure:
      type: object
      properties:
        market:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
        claimType:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        currency:
          type: string
        openClaims:
          type: integer
          format: int64
        totalExposure:
          type: number
    Summary:
      type: object
      properties:
        claimsByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        openClaims:
          type: integer
          format: int64
        unassignedBacklog:
          type: integer
          format: int64
        exposure:
          type: array
          items:
            $ref: "#/components/schemas/Exposure"
    SlaBreach:
      type: object
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        market:
          type: string
          enum:
          - SG
          - HK
          - MY
          - TH
          - ID
          - AU
        claimType:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - INFO_REQUESTED
          - APPROVED
          - REJECTED
          - SETTLED
        assignedOfficerId:
          type: string
        breachType:
          type: string
          enum:
          - UNASSIGNED_TOO_LONG
          - OPEN_TOO_LONG
        ageHours:
          type: integer
          format: int64
        thresholdHours:
          type: integer
          format: int64
    OfficerPerformance:
      type: object
      properties:
        officerId:
          type: string
        closedClaims:
          type: integer
          format: int64
        settled:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        averageResolutionHours:
          type: number
          format: double
    ConvertedExposure:
      type: object
      properties:
        currency:
          type: string
        openClaims:
          type: integer
          format: int64
        originalAmount:
          type: number
        convertedAmount:
          type: number
    ExposureTotal:
      type: object
      properties:
        baseCurrency:
          type: string
        totalExposure:
          type: number
        openClaims:
          type: integer
          format: int64
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/ConvertedExposure"
        rateSource:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
