server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    # Defaults to in-memory H2 so the service runs with no setup; docker-compose overrides these with PostgreSQL.
    url: ${DB_URL:jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:   # used only to dead-letter poison messages
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

# app.security.demo-password: set APP_SECURITY_DEMO_PASSWORD (a random one is generated and logged if unset)
